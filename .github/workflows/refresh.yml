name: Refresh jobs

on:
  schedule:
    - cron: "0 05 * * *"
    - cron: "0 11 * * *"
    - cron: "0 17 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull job postings
        run: python fetch_jobs.py
      - name: Save results
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add jobs.json
          if ! git diff --staged --quiet; then
            git commit -m "Refresh jobs"
            git push
          fi

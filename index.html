<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design roles</title>
<style>
:root{--bg:#F4F5F8;--surface:#fff;--ink:#151922;--muted:#5C6373;--line:#DFE2E9;--accent:#3A37E8;--new:#0E9F6E;--warn:#B54708;--chip:#ECEEF5;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10121A;--surface:#181B26;--ink:#ECEFF6;--muted:#9AA2B5;--line:#2A2F3E;--accent:#8B89FF;--new:#34D399;--warn:#FDB022;--chip:#232837;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit}
header{max-width:1100px;margin:0 auto;padding:28px 20px 8px}
h1{margin:0;font-size:28px;letter-spacing:-.02em}
#status{margin:4px 0 12px;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:8px 14px;border-bottom:3px solid transparent;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--accent)}
.grid{max-width:1100px;margin:0 auto;padding:16px 20px 48px;display:grid;grid-template-columns:260px 1fr;gap:24px;align-items:start}
aside{position:sticky;top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
aside label{display:block;margin:0 0 4px;font-weight:600;font-size:13px}
aside .f{margin-bottom:14px}
aside .row label{display:flex;gap:8px;align-items:center;font-weight:400;font-size:14px;margin:0 0 4px}
input[type=search],select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
details{font-size:14px}summary{cursor:pointer;font-weight:600;font-size:13px}
details a{display:block;margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;display:grid;grid-template-columns:1fr 84px;gap:12px}
.card.gone{opacity:.6}
.card h2{margin:0;font-size:17px;line-height:1.3}
.card h2 a{text-decoration:none}.card h2 a:hover{text-decoration:underline}
.meta{color:var(--muted);font-size:13px;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{background:var(--chip);color:var(--ink);border:0;border-radius:999px;padding:2px 10px;font:inherit;font-size:12px}
button.tag{cursor:pointer}button.tag:hover{outline:1px solid var(--accent)}
.tag.new{background:var(--new);color:#fff}
.tag.cat{background:var(--accent);color:var(--surface)}
.tag.warn{background:var(--warn);color:var(--surface);font-weight:600}
.side{text-align:right;font-variant-numeric:tabular-nums}
.star{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:0 0 4px}
.star[aria-pressed=true]{color:#E8A400}
.side small{display:block;color:var(--muted);font-size:11px;line-height:1.2}
.side b{font-size:20px}
.bar{height:4px;border-radius:2px;background:var(--chip);margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.empty{padding:32px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.tools{display:flex;gap:8px;margin-bottom:10px;align-items:center;color:var(--muted);font-size:13px;flex-wrap:wrap}
.tools button{padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
footer{max-width:1100px;margin:0 auto;padding:0 20px 32px;color:var(--muted);font-size:13px}
@media (max-width:760px){.grid{grid-template-columns:1fr}aside{position:static}}
</style>
</head>
<body>
<header>
  <h1>Design roles</h1>
  <p id="status">Loading…</p>
  <div class="tabs" role="tablist">
    <button role="tab" id="t-all" aria-selected="true">All roles</button>
    <button role="tab" id="t-fav" aria-selected="false">Favorites (<span id="fc">0</span>)</button>
  </div>
</header>
<div class="grid">
  <aside id="filters">
    <div class="f"><label for="q">Search</label><input id="q" type="search" placeholder="Figma, packaging, brand…"></div>
    <div class="f" id="srcs"></div>
    <div class="f row"><label>Work setup</label>
      <label><input type="checkbox" name="wp" value="remote" checked> Remote</label>
      <label><input type="checkbox" name="wp" value="hybrid" checked> Hybrid</label>
      <label><input type="checkbox" name="wp" value="onsite" checked> On-site</label>
      <label><input type="checkbox" name="wp" value="unknown" checked> Not stated</label>
    </div>
    <div class="f"><label for="st">State</label><select id="st"></select></div>
    <div class="f"><label for="city">City</label><select id="city"></select></div>
    <div class="f row"><label><input id="rem" type="checkbox" checked> Keep remote roles with no location</label></div>
    <div class="f"><label for="cat">Role type</label><select id="cat"></select></div>
    <div class="f"><label for="tag">Skill or specialty</label><select id="tag"></select></div>
    <div class="f"><label for="type">Employment</label>
      <select id="type"><option value="">Any</option><option>Full-time</option><option>Contract</option><option>Part-time</option><option>Unknown</option></select></div>
    <div class="f"><label for="sort">Sort by</label>
      <select id="sort"><option value="score">Best match</option><option value="new">Newest</option></select></div>
    <div class="f row"><label><input id="only" type="checkbox" checked> Design-related roles only</label></div>
    <details><summary>Search other sites</summary><div id="else"></div></details>
  </aside>
  <section id="list" aria-live="polite"></section>
</div>
<footer>Job data: Aquent, The Muse, and Remotive. Work setup, tags, start dates, and durations are read from each posting’s text, so check the posting before you apply. Favorites are saved in this browser only.</footer>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const enc=encodeURIComponent;
const TIERS=[
 {name:"UX/UI",w:10,re:/\b(ux|ui)\b|user (experience|interface)|product design|interaction design|design systems?/i},
 {name:"Package",w:8,re:/packag(e|ing)|dieline|structural design|label design/i},
 {name:"Web",w:7,re:/web ?design|website|digital design|front[- ]?end design|landing page/i},
 {name:"Brand",w:6,re:/brand(ing)? design|brand designer|creative brand|brand identity/i},
 {name:"Art direction",w:6,re:/art director|creative director/i},
 {name:"Production",w:5,re:/production (artist|designer)|pre-?press|layout|retouch/i},
 {name:"Illustration",w:5,re:/illustrat/i},
 {name:"Motion",w:5,re:/motion|animat|video/i},
 {name:"Graphic/Visual",w:5,re:/graphic|visual design|designer/i},
 {name:"Other design",w:4,re:/design/i}
];
const BAD=/\b(writer|copywriter|engineer|recruiter|analyst|accountant|developer)\b/i;
function score(j){
  let best=0,cat="";
  for(const t of TIERS) if(t.re.test(j.title)&&t.w>best){best=t.w;cat=t.name}
  const d=(j.description||"")+" "+(j.tags||[]).join(" ");
  let s=best+Math.min(4,TIERS.slice(0,3).filter(t=>t.re.test(d)).length+((j.tags||[]).length>2?1:0));
  if(best&&BAD.test(j.title)) s-=6;
  if(!best) s=0;
  j._cat=cat; j._score=Math.max(0,Math.min(100,Math.round(s/14*100)));
}
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let DATA,JOBS=[],BYID={},FAVS=store.get("jobfavs",{}),OFF=new Set(store.get("jobsrcoff",[])),TAB="all";
const CTRL=["q","st","city","rem","cat","tag","type","sort","only"];
function saveFilters(){const o={};CTRL.forEach(k=>{const e=$("#"+k);o[k]=e.type==="checkbox"?e.checked:e.value});o.wp=[...document.querySelectorAll("[name=wp]")].map(x=>x.checked);store.set("jobfilters",o)}
function restore(){const o=store.get("jobfilters",{});CTRL.forEach(k=>{if(!(k in o)||k==="city")return;const e=$("#"+k);if(e.type==="checkbox")e.checked=o[k];else e.value=o[k]});(o.wp||[]).forEach((v,i)=>{const e=document.querySelectorAll("[name=wp]")[i];if(e)e.checked=v});return o.city||""}
function opts(label,counts){return `<option value="">${label}</option>`+Object.keys(counts).sort().map(k=>`<option value="${esc(k)}">${esc(k)} (${counts[k]})</option>`).join("")}
function tally(f){const c={};JOBS.forEach(j=>[].concat(f(j)).forEach(v=>{if(v)c[v]=(c[v]||0)+1}));return c}
function fillCities(keep){const st=$("#st").value,c={};JOBS.forEach(j=>{if(j.city&&(!st||j.state===st))c[j.city]=(c[j.city]||0)+1});$("#city").innerHTML=opts("All cities",c);if(keep&&c[keep])$("#city").value=keep}
function fillSources(){$("#srcs").className="f row";$("#srcs").innerHTML="<label>Sources</label>"+Object.entries(DATA.counts).map(([k,n])=>`<label><input type="checkbox" data-src="${esc(k)}" ${OFF.has(k)?"":"checked"}> ${esc(k)} (${n})</label>`).join("")}
function fmt(d){return new Date(d+"T12:00:00").toLocaleDateString([],{month:"short",day:"numeric",year:"numeric"})}
function ago(d){if(!d)return"";const n=Math.round((Date.now()-new Date(d+"T12:00:00"))/864e5);return n<=0?"today":n===1?"yesterday":n+" days ago"}
function card(j,gone){
  const where=[j.city,j.state].filter(Boolean).join(", ")||"Location not stated";
  const wl={remote:"Remote",hybrid:"Hybrid",onsite:"On-site",unknown:"Setup not stated"}[j.workplace];
  const when=[j.start?(j.start==="ASAP"?"Starts ASAP":"Starts "+fmt(j.start)):"",j.duration?"Duration "+j.duration:""].filter(Boolean).join(" · ");
  const saved=!!FAVS[j.id];
  return `<article class="card${gone?" gone":""}"><div>
    <h2><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a></h2>
    <div class="meta">${esc(j.company)} · ${esc(where)}${j.posted?" · posted "+ago(j.posted):""}${j.pay?" · "+esc(j.pay):""}</div>
    ${when?`<div class="meta">${esc(when)}</div>`:""}
    <div class="tags">${gone?'<span class="tag warn" title="This posting is no longer in the latest refresh. It may have been filled or removed.">! No longer listed</span>':""}${!gone&&j.first_seen===DATA.updated.slice(0,10)?'<span class="tag new">New</span>':""}${j._cat?`<span class="tag cat">${esc(j._cat)}</span>`:""}<span class="tag">${wl}</span><span class="tag">${esc(j.type)}</span>${(j.tags||[]).map(t=>`<button class="tag" data-tag="${esc(t)}">${esc(t)}</button>`).join("")}<span class="tag">${esc(j.source)}</span></div>
  </div><div class="side"><button class="star" data-id="${esc(j.id)}" aria-pressed="${saved}" aria-label="${saved?"Remove from favorites":"Save to favorites"}">${saved?"★":"☆"}</button><small>Match score</small><b>${j._score}</b><div class="bar"><i style="width:${j._score}%"></i></div></div></article>`}
function elsewhere(q,city,st){
  const kw=q||"graphic designer",loc=city?`${city}, ${st}`:st;
  const remoteOnly=[...document.querySelectorAll("[name=wp]:checked")].map(x=>x.value).join()==="remote";
  const l=loc||(remoteOnly?"Remote":"");
  $("#else").innerHTML=[["Indeed",`https://www.indeed.com/jobs?q=${enc(kw)}&l=${enc(l)}`],["Google Jobs",`https://www.google.com/search?q=${enc(kw+" jobs"+(l?" in "+l:""))}&ibp=htl;jobs`],["Handshake (login)",`https://app.joinhandshake.com/stu/postings?query=${enc(kw)}`],["LinkedIn",`https://www.linkedin.com/jobs/search/?keywords=${enc(kw)}&location=${enc(l)}`]].map(([n,u])=>`<a href="${u}" target="_blank" rel="noopener">${n}</a>`).join("")}
function render(){
  $("#fc").textContent=Object.keys(FAVS).length;
  $("#filters").style.display=TAB==="all"?"":"none";
  document.querySelector(".grid").style.gridTemplateColumns=TAB==="all"?"":"1fr";
  $("#t-all").setAttribute("aria-selected",TAB==="all");$("#t-fav").setAttribute("aria-selected",TAB==="fav");
  const upd=new Date(DATA.updated).toLocaleString([],{dateStyle:"medium",timeStyle:"short"});
  if(TAB==="fav")return renderFavs(upd);
  const q=$("#q").value.trim().toLowerCase(),st=$("#st").value,city=$("#city").value,type=$("#type").value,cat=$("#cat").value,tag=$("#tag").value,rem=$("#rem").checked,only=$("#only").checked;
  const wp=[...document.querySelectorAll("[name=wp]:checked")].map(x=>x.value);
  elsewhere($("#q").value.trim(),city,st);
  let r=JOBS.filter(j=>{
    if(OFF.has(j.source)||(only&&!j._score)||!wp.includes(j.workplace))return false;
    if(type&&j.type!==type||cat&&j._cat!==cat||tag&&!(j.tags||[]).includes(tag))return false;
    if(q&&!(j.title+" "+j.company+" "+(j.description||"")+" "+(j.tags||[]).join(" ")).toLowerCase().includes(q))return false;
    if(st||city){if(!j.state&&!j.city)return rem&&j.workplace==="remote";if(st&&j.state!==st||city&&j.city!==city)return false}
    return true});
  r.sort($("#sort").value==="new"?(a,b)=>(b.posted||"").localeCompare(a.posted||"")||b._score-a._score:(a,b)=>b._score-a._score||(b.posted||"").localeCompare(a.posted||""));
  $("#status").textContent=`${r.length} of ${JOBS.length} roles · updated ${upd}`;
  $("#list").innerHTML=r.length?r.map(j=>card(j)).join(""):'<div class="empty">No roles match these filters. Try another state, turn a source back on, or clear the skill filter.</div>';
}
function renderFavs(upd){
  const items=Object.values(FAVS).map(f=>{const live=BYID[f.id];if(live)return{j:live,gone:false};score(f);return{j:f,gone:true}});
  items.sort((a,b)=>a.gone-b.gone||b.j._score-a.j._score);
  $("#status").textContent=`${items.length} saved · ${items.filter(i=>i.gone).length} no longer listed · updated ${upd}`;
  $("#list").innerHTML=`<div class="tools"><button id="exp">Export favorites</button><button id="imp">Import favorites</button><span>Back up favorites to move them to another device.</span><input id="impf" type="file" accept=".json" hidden></div>`+(items.length?items.map(i=>card(i.j,i.gone)).join(""):'<div class="empty">No favorites yet. Click the star on any role to save it here.</div>');
}
document.addEventListener("click",e=>{
  const t=e.target;
  if(t.closest(".star")){const id=t.closest(".star").dataset.id;
    if(FAVS[id])delete FAVS[id];else{const j=BYID[id]||FAVS[id];FAVS[id]={...j,saved:new Date().toISOString().slice(0,10)}}
    store.set("jobfavs",FAVS);render()}
  else if(t.dataset.tag){TAB="all";$("#tag").value=t.dataset.tag;saveFilters();render()}
  else if(t.id==="t-all"||t.id==="t-fav"){TAB=t.id==="t-all"?"all":"fav";render()}
  else if(t.id==="exp"){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(FAVS,null,1)],{type:"application/json"}));a.download="design-job-favorites.json";a.click()}
  else if(t.id==="imp")$("#impf").click();
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="impf"&&t.files[0]){t.files[0].text().then(x=>{try{Object.assign(FAVS,JSON.parse(x));store.set("jobfavs",FAVS);render()}catch(err){alert("That file couldn’t be read as a favorites backup.")}})}
});
fetch("jobs.json?"+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
  DATA=d;JOBS=d.jobs;JOBS.forEach(j=>{score(j);BYID[j.id]=j});
  $("#st").innerHTML=opts("All states",tally(j=>j.state));
  $("#cat").innerHTML=opts("All role types",tally(j=>j._cat));
  $("#tag").innerHTML=opts("Any skill",tally(j=>j.tags||[]));
  fillSources();const keepCity=restore();fillCities(keepCity);
  $("#filters").addEventListener("input",e=>{
    const s=e.target.dataset.src;if(s){e.target.checked?OFF.delete(s):OFF.add(s);store.set("jobsrcoff",[...OFF])}
    if(e.target.id==="st")fillCities();saveFilters();render()});
  render();
}).catch(()=>{
  $("#status").textContent="No job data yet";
  $("#list").innerHTML='<div class="empty">jobs.json wasn’t found. In your GitHub repository, open Actions, choose “Refresh jobs”, and click Run workflow. If you opened this file from your computer, use your GitHub Pages link instead.</div>';
});
</script>
</body>
</html>

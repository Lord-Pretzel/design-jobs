name: Refresh jobs

on:
  schedule:
    # GitHub Actions cron is UTC and does not follow daylight saving time.
    # Odd minutes on purpose: GitHub delays or drops runs scheduled at :00.
    # These are pinned to EST (UTC-5); during EDT each run lands one hour later.
    - cron: "17 10 * * *"  # 10:17 UTC = 5:17 AM EST  (6:17 AM EDT)
    - cron: "43 16 * * *"  # 16:43 UTC = 11:43 AM EST (12:43 PM EDT)
    - cron: "11 22 * * *"  # 22:11 UTC = 5:11 PM EST  (6:11 PM EDT)
    - cron: "37 4 * * *"   # 04:37 UTC = 11:37 PM EST (12:37 AM EDT)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-jobs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull job postings
        run: python fetch_jobs.py
        env:
          # Optional: Adzuna is skipped when these secrets are not set.
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      - name: Save results
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add jobs.json
          if ! git diff --staged --quiet; then
            git commit -m "Refresh jobs"
            git pull --rebase origin main
            git push
          fi
